# Keeps the live site awake.
#
# Render's free plan puts the app to sleep after 15 minutes without a
# visitor, and the next visitor then waits about a minute. This asks the
# site's health page every 5 minutes from a GitHub runner, so it never goes
# 15 minutes without a request.
#
# GitHub sometimes starts scheduled jobs late when it is busy, so a rare
# sleep is still possible. GitHub also switches scheduled workflows off after
# 60 days without a commit to the repository; re-enable it on the Actions tab.
name: Keep the live site awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the health page
        # Generous limits: if the site was asleep, waking it takes about a minute.
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 https://transactflow.onrender.com/health
